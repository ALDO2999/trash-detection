<!DOCTYPE html>

                    "surface-container": "#edeeef",

                    "error": "#ba1a1a",

                    "on-tertiary-fixed": "#261a00",

                    "primary-fixed-dim": "#88d982",

                    "tertiary-fixed-dim": "#fabd00",
                    "on-secondary-fixed-variant": "#603f33",
                    "surface-variant": "#e1e3e4",
                    "on-tertiary": "#ffffff",
                    "on-primary": "#ffffff",
                    "inverse-on-surface": "#f0f1f2",
                    "surface-dim": "#d9dadb",

                    "tertiary-container": "#8c6800",

            "borderRadius": {
                    "DEFAULT": "0.25rem",

<style>
        .camera-overlay {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
        }
        .scanner-frame {
            position: relative;
            width: 280px;
            height: 280px;
        }
        .scanner-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #a3f69c;
            border-style: solid;
        }
        .corner-tl { top: 0; left: 0; border-width: 4px 0 0 4px; border-top-left-radius: 16px; }
        .corner-tr { top: 0; right: 0; border-width: 4px 4px 0 0; border-top-right-radius: 16px; }
        .corner-bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-bottom-left-radius: 16px; }
        .corner-br { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-bottom-right-radius: 16px; }
        
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #a3f69c, transparent);
            box-shadow: 0 0 15px #a3f69c;
            animation: scan 3s ease-in-out infinite;
        }
        
        @keyframes scan {
            0%, 100% { top: 5%; }
            50% { top: 95%; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-on-surface overflow-hidden h-screen font-body-md text-on-surface">
<!-- Full Screen Camera View (Simulated with Image) -->
<div class="fixed inset-0 z-0">
<img alt="Camera Feed" class="w-full h-full object-cover grayscale-[20%]" data-alt="A high-definition view from a mobile phone camera lens focusing on a recycling bin area with various waste containers in a modern, clean urban environment. The lighting is bright and natural, typical of a professional light-mode UI aesthetic. The scene is slightly desaturated to provide a technical, operational feel for a waste management officer application. Subtle lens flare and soft focus in the background enhance the realism of a live camera feed." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD_Nw3-_c3R0AG5x_Xm3YxQbh_hRQVh-bAK_bLJcDZtgax8U4sI7KWIQsHYWzYZMBBYfIn7bJomfXQ_zgL4DgshrSnY7n-f-Yr6ATnuFFkT85Bjg5LEKM7GiT_oJXAqnTPZphGixUJEPnDyTL5h-tGtjQPFW-2L6Ws-Kx_LncC6YCLWLEg8uqmxbHpEvYAnt_q-GgNY1d8md84-YWMxQAunwgSgkSjqKpFvqSS2A45_Me7HNnYrFjLS5V6Rdk0QFbMOMA2sIMkYY3x4"/>
</div>
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-surface/80 backdrop-blur-md shadow-sm">
<button aria-label="Back" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-primary">Scan User QR</h1>
<button aria-label="Help" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-primary">help</span>
</button>
</header>
<!-- Scanning Interface Overlay -->
<main class="relative z-10 flex flex-col items-center justify-center h-screen pt-16 pb-32">
<!-- Scrim / Dimmer -->
<div class="absolute inset-0 camera-overlay pointer-events-none"></div>
<!-- Scanner Frame Container -->
<div class="relative flex flex-col items-center gap-base">
<div class="scanner-frame z-20">
<div class="scanner-corner corner-tl"></div>
<div class="scanner-corner corner-tr"></div>
<div class="scanner-corner corner-bl"></div>
<div class="scanner-corner corner-br"></div>
<div class="scan-line"></div>
</div>
<p class="text-white font-label-md bg-on-surface/40 px-4 py-2 rounded-full backdrop-blur-sm mt-4">
                Align QR code within frame
            </p>
</div>
<!-- Floating Quick Actions -->
<div class="absolute left-margin-mobile top-1/2 -translate-y-1/2 flex flex-col gap-md">
<button class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-primary shadow-lg active:scale-90 transition-transform" id="torch-toggle">
<span class="material-symbols-outlined" data-weight="fill">light_mode</span>
</button>
</div>
<div class="absolute right-margin-mobile top-1/2 -translate-y-1/2 flex flex-col gap-md">
<button class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-primary shadow-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined">zoom_in</span>
</button>
</div>
</main>
<!-- Bottom Action Sheet / Manual Entry -->
<section class="fixed bottom-0 left-0 w-full z-50 glass-panel rounded-t-xl px-margin-mobile pt-6 pb-10 shadow-lg">
<div class="max-w-md mx-auto">
<div class="flex items-center justify-center mb-4">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<div class="space-y-4">
<div class="flex flex-col gap-1">
<label class="font-label-md text-on-surface-variant" for="submission-id">Manual Submission ID</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-xl h-14 px-4 text-body-md focus:ring-2 focus:ring-primary focus:bg-white transition-all outline-none" id="submission-id" placeholder="e.g. WS-9842-X" type="text"/>
<button class="absolute right-2 top-2 h-10 px-6 rounded-full bg-primary text-on-primary font-label-md active:scale-95 transition-transform">
                            Submit
                        </button>
</div>
</div>
<div class="flex items-center justify-between text-on-surface-variant font-label-sm pt-2">
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">info</span>
                        Scanning active...
                    </span>
<span class="flex items-center gap-1 text-primary">
<span class="w-2 h-2 bg-primary rounded-full animate-pulse"></span>
                        Live System
                    </span>
</div>
</div>
</div>
</section>
<!-- Interaction Script -->
<script>
        document.getElementById('torch-toggle').addEventListener('click', function() {
            const icon = this.querySelector('.material-symbols-outlined');
            const isFilled = icon.getAttribute('data-weight') === 'fill';
            
            if (isFilled) {
                icon.removeAttribute('data-weight');
                icon.style.fontVariationSettings = "'FILL' 0";
                this.classList.remove('bg-primary-fixed');
                this.classList.add('glass-panel');
            } else {
                icon.setAttribute('data-weight', 'fill');
                icon.style.fontVariationSettings = "'FILL' 1";
                this.classList.remove('glass-panel');
                this.classList.add('bg-primary-fixed');
            }
        });

        // Simple haptic feedback simulation
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });
    </script>
</body></html>
