<body class="bg-background text-on-surface min-h-screen pb-32">
<!-- Top App Bar (Shared Component Logic) -->
<header class="bg-surface sticky top-0 z-50 w-full border-b border-outline-variant shadow-sm flex items-center justify-between px-margin-mobile py-sm">
<div class="flex items-center gap-4">
<button aria-label="Go back" class="active:scale-95 transition-transform p-2 hover:bg-surface-variant/50 rounded-full">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Hapus Akun</h1>
</div>
<div class="flex items-center gap-2">
<div class="w-10 h-10 rounded-full bg-surface-container-highest overflow-hidden border border-outline-variant">
<img alt="User Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAhIDLPygJWrH7GKdDMivu-16KriN1lZd5CCrWNOmpSfdhAIsbrmekZUmcPWVsL4Tiivs0grviRd-RnUB7I05ZjBoFZdog2oIF078skjbTRKO8HCt_zz7r_6gxEX-CgytPzeqZB0-mBqZPRE6-ormJGmTy6SDEnjQ1Q3mosusT24JFlh0bCU7LhzT2ZiNnDaFamn0bYSjMFl4CcnQt3WvzwoO9jI61x7_0xg-1OxsOn6mS7yY4CPnPtLavphk05Sbr1grO1S9Uu2s25"/>
</div>
</div>

<main class="max-w-max-width mx-auto px-margin-mobile md:px-0 py-lg">
<!-- Hero Section / Status -->
<!-- Section 3: Danger Zone -->
<section class="bg-error-container/10 border-2 border-dashed border-error/30 rounded-xl p-md mt-lg mt-0">
<div class="flex items-start gap-md mb-md">
<div class="w-12 h-12 rounded-full bg-error/10 flex items-center justify-center flex-shrink-0 text-error">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<div class="space-y-1">
<h3 class="font-headline-md text-headline-md text-error font-bold">Danger Zone</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Deleting your account is permanent. All your progress, earned badges, and 1,240 points will be permanently lost and cannot be recovered.</p>
</div>
</div>
<div class="bg-surface-container-lowest p-md rounded-lg border border-outline-variant space-y-md">
<div>
<label class="font-label-md text-label-md text-on-surface block mb-2" for="confirm-delete">Please type <span class="font-bold text-error">HAPUS AKUN</span> to confirm deletion</label>
<input class="w-full bg-surface-container border-none focus:ring-2 focus:ring-error rounded-lg px-md py-3 text-on-surface placeholder:text-outline-variant transition-all font-body-md" id="confirm-delete" placeholder="HAPUS AKUN" type="text"/>
</div>
<button class="w-full bg-surface-dim text-on-surface-variant font-bold py-3 rounded-full flex items-center justify-center gap-2 cursor-not-allowed transition-all duration-300" disabled="" id="delete-btn">
<span class="material-symbols-outlined">delete_forever</span>
                    Delete Account
                </button>
</div>
</section>
</main>
<!-- Bottom Navigation Bar (Shared Component Logic) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface shadow-[0_-4px_20px_rgba(0,0,0,0.04)] rounded-t-xl md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary transition-all duration-200 active:scale-90" href="#">

</a>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</a>
</nav>
<script>
        // Simple logic for the delete confirmation input
        const deleteInput = document.getElementById('confirm-delete');
        const deleteBtn = document.getElementById('delete-btn');

        deleteInput.addEventListener('input', (e) => {
            if (e.target.value === 'HAPUS AKUN') {
                deleteBtn.classList.remove('bg-surface-dim', 'text-on-surface-variant', 'cursor-not-allowed');
                deleteBtn.classList.add('bg-error', 'text-white', 'hover:bg-error-container', 'hover:text-on-error-container', 'active:scale-95');
                deleteBtn.disabled = false;
            } else {
                deleteBtn.classList.add('bg-surface-dim', 'text-on-surface-variant', 'cursor-not-allowed');
                deleteBtn.classList.remove('bg-error', 'text-white', 'hover:bg-error-container', 'hover:text-on-error-container', 'active:scale-95');
                deleteBtn.disabled = true;
            }
        });

        // Hover effect for the session cards
        document.querySelectorAll('.session-item').forEach(item => {
            item.addEventListener('mouseenter', () => {
                item.classList.add('shadow-md', '-translate-y-0.5');
            });
            item.addEventListener('mouseleave', () => {
                item.classList.remove('shadow-md', '-translate-y-0.5');
            });
        });
    </script>
