<style>

            fill: none;

        }
        .checkmark {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: block;
            stroke-width: 4;
            stroke: #fff;
            stroke-miterlimit: 10;
            margin: 10% auto;
            box-shadow: inset 0px 0px 0px #0d631b;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
        }
        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }
        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
        @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
        @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 60px #0d631b; } }

<!-- BottomNavBar (Suppressed as per relevance check for success splash screen, but I'll add a minimal floating home if needed) -->
<!-- The prompt implies a focused transactional screen, so BottomNavBar is excluded to prioritize the success message. -->
<script>
        // Micro-interaction for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.transform = 'scale(0.98)';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = 'scale(1)';
            });
        });

        // Soft pulse effect for the metrics
        setInterval(() => {
            const metrics = document.querySelectorAll('.bg-surface-container-lowest');
            metrics.forEach((m, i) => {
                setTimeout(() => {
                    m.classList.add('shadow-md');
                    setTimeout(() => m.classList.remove('shadow-md'), 1000);
                }, i * 200);
            });
        }, 4000);
    </script>
