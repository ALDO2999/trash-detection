<!-- Micro-interactions Script -->
<script>
        function toggleCategory(element) {
            element.classList.toggle('active');
            
            // Pulsing effect on click
            const icon = element.querySelector('.icon-container');
            icon.animate([
                { transform: 'scale(1)' },
                { transform: 'scale(0.9)' },
                { transform: 'scale(1)' }
            ], {
                duration: 200,
                easing: 'ease-in-out'
            });

            // Update Submit Button State
            const anyActive = document.querySelectorAll('.category-card.active').length > 0;
            const submitBtn = document.getElementById('submit-btn');
            if (anyActive) {
                submitBtn.classList.remove('opacity-50');
                submitBtn.disabled = false;
            } else {
                // Keep it active but maybe change style if needed. Standard practice is to let them finish empty too if they want.
            }
        }

        // Initialize state
        document.addEventListener('DOMContentLoaded', () => {
            console.log("WasteSort AI Selection Ready");
        });
    </script>
