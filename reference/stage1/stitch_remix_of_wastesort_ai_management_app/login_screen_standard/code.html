            box-shadow: 0 0 15px rgba(13, 99, 27, 0.3);

    body {
      min-height: max(884px, 100dvh);

  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md">
<!-- Auth Header (Minimal TopAppBar) -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-margin-mobile h-16 bg-surface shadow-sm">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-100 ease-in-out">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<span class="text-headline-md font-headline-md font-bold text-primary">WasteSort AI</span>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center pt-24 pb-12 px-margin-mobile max-w-md mx-auto w-full">
<!-- Hero Section / Branding -->
<div class="w-full mb-10 text-center">
<div class="w-20 h-20 bg-primary-container/10 rounded-3xl flex items-center justify-center mx-auto mb-6">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">recycling</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile mb-2">Selamat Datang Kembali</h1>
<p class="font-body-md text-on-surface-variant">Lanjutkan langkah Anda dalam menjaga kelestarian bumi.</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-6" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md ml-1" for="email">Email</label>
<div class="relative group">
<input class="w-full h-14 px-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary focus:bg-white transition-all outline-none text-body-md" id="email" placeholder="nama@email.com" required="" type="email"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary">mail</span>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md" for="password">Kata Sandi</label>
<button class="text-primary font-label-md text-label-md hover:underline" onclick="alert('Link reset dikirim ke email Anda!')" type="button">Lupa Password?</button>
</div>
<div class="relative group">
<input class="w-full h-14 px-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary focus:bg-white transition-all outline-none text-body-md" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Main CTA -->
<button class="w-full h-14 bg-primary text-on-primary rounded-full font-label-md text-body-md font-bold shadow-md hover:brightness-110 active:scale-95 transition-all duration-100 flex items-center justify-center gap-2">
                Masuk
                <span class="material-symbols-outlined">login</span>
</button>
</form>
<!-- Divider -->
<div class="w-full flex items-center my-8 gap-4">
<div class="flex-grow h-px bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-outline">Atau masuk dengan</span>
<div class="flex-grow h-px bg-outline-variant"></div>
</div>
<!-- Social Logins -->
<div class="w-full grid grid-cols-2 gap-4">
<button class="h-14 flex items-center justify-center gap-3 bg-white border border-outline-variant rounded-full font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors active:scale-95">
<img alt="Google" class="w-6 h-6" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAw5NEsjj1WBE0A0A_pjK1eifAH7s1ywfjKKg4L19YUCXJduIgVHrY6-LJgqx5c2s8U6uR6WbZvV7EGU-jkxALm-4urszaL4iA7d1GNE_ukgXmSZtvoairRtApaDJZ7AfysbwakAS7Eu5jUtSOTB1wxc6oIdWBJ8NlIwqL7-IkZZnpDhDVOKG_WhGGQdhn23hntZFCGPWPAn0yuenB7ZbF8JPbaOFtXQllceWSO8OQ_PoYzTJeZQOpsdI4S5ZgJz9M9hTSIb8W562lZ"/>
                Google
            </button>
<button class="h-14 flex items-center justify-center gap-3 bg-on-surface text-white rounded-full font-label-md text-label-md hover:opacity-90 transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">ios</span>
                Apple
            </button>
</div>
<!-- Biometric Prompt -->
<div class="mt-auto pt-12 pb-6 text-center">
<button class="group flex flex-col items-center gap-3 text-on-surface-variant hover:text-primary transition-colors">
<div class="w-12 h-12 rounded-full flex items-center justify-center border border-outline-variant group-hover:border-primary group-hover:bg-primary-container/5 transition-all">
<span class="material-symbols-outlined text-3xl">face</span>
</div>
<p class="font-label-sm text-label-sm">Gunakan Face ID untuk masuk lebih cepat</p>
</button>
</div>
<!-- Register Link -->
<div class="mt-8">
<p class="font-label-md text-label-md text-on-surface-variant">
                Belum punya akun? 
                <a class="text-primary font-bold hover:underline" href="#">Daftar Sekarang</a>
</p>
</div>
</main>
<!-- Decorative Elements (Eco Abstract Patterns) -->
<div class="fixed -bottom-24 -left-24 w-64 h-64 bg-primary-container/5 rounded-full blur-3xl -z-10"></div>
<div class="fixed -top-12 -right-12 w-48 h-48 bg-tertiary-fixed/10 rounded-full blur-2xl -z-10"></div>
<script>
        // Simple Interaction logic
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.querySelector('label').classList.remove('text-primary');
            });
        });
    </script>
</body></html>
