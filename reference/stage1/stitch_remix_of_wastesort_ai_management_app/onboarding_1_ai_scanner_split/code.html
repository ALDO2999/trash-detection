<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-mesh {
            background-color: #f8f9fa;
            background-image: 
                radial-gradient(at 0% 0%, rgba(163, 246, 156, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(13, 99, 27, 0.05) 0px, transparent 50%);
        }
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col items-center overflow-hidden">
<!-- TopAppBar -->
<nav class="w-full top-0 sticky bg-background flex justify-between items-center px-margin-mobile py-sm z-50">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary text-headline-md" data-icon="recycling">recycling</span>
<span class="font-headline-md text-headline-md font-bold text-primary">WasteSort AI</span>
</div>
<button class="text-on-surface-variant font-label-md hover:opacity-80 transition-opacity active:scale-95 duration-100">
            Lewati
        </button>
</nav>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md mx-auto flex flex-col items-center justify-center px-margin-mobile bg-mesh relative">
<!-- Illustration Container -->
<div class="relative w-full aspect-square flex items-center justify-center mb-lg fade-in">
<!-- Decorative Background Element -->
<div class="absolute inset-0 bg-primary-fixed opacity-10 rounded-full blur-3xl transform -translate-y-4"></div>
<img alt="Person scanning a bottle with AI" class="relative z-10 w-full h-auto object-contain drop-shadow-xl" src="https://lh3.googleusercontent.com/aida/AP1WRLuk8mOR0eqeJRmMA5uDU5ADd9gMvJ2U6gzgc4cydOMLT3NHVTZdYusFcqJJJ6jWVqRP5pTO79PEb11AQq6OZKH0KwHmzKm13Y7SYmCh8M9MvC3wtxaN-dBDHGym0yEV2jhycVdBmS4tuxl7hI-3-I3l5RVraDDE5OainngMZVoBOQK9IBqrxiqVFiGCNdBDcnb2NB47D0ieYeSiFFiz3v_cu6b-CrVBF6y8PJgOmxTBydrbzgCHP4NTg0k" style="max-height: 320px;"/>
</div>
<!-- Text Content -->
<div class="text-center space-y-md fade-in" style="animation-delay: 0.2s;">
<!-- Badge -->
<div class="inline-flex items-center gap-xs px-sm py-xs bg-primary-container/10 text-primary rounded-full border border-primary/10">
<span class="material-symbols-outlined text-[18px]" data-icon="robot_2">robot_2</span>
<span class="font-label-md text-label-md">AI Scanner</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface leading-tight px-sm">
                Scan dan Kenali Sampahmu
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                Identifikasi jenis sampah hanya dengan mengambil foto menggunakan teknologi AI kami.
            </p>
</div>
</main>
<!-- Navigation & CTA Shell -->
<footer class="w-full bg-background flex flex-col items-center px-margin-mobile pb-xl pt-md gap-lg">
<!-- BottomNavBar (Step Indicator) -->
<div class="flex justify-center items-center gap-xs">
<!-- Active Dot -->
<div class="w-3 h-3 bg-primary rounded-full transition-all duration-300" title="Step 1"></div>
<!-- Inactive Dots -->
<div class="w-2 h-2 bg-outline-variant rounded-full transition-all duration-300" title="Step 2"></div>
<div class="w-2 h-2 bg-outline-variant rounded-full transition-all duration-300" title="Step 3"></div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary py-md px-xl rounded-full font-label-md flex items-center justify-center gap-sm hover:opacity-90 active:scale-95 transition-all duration-200 shadow-lg shadow-primary/20 group">
            Lanjut
            <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
<script>
        // Simple micro-interaction for the button
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            this.classList.add('scale-95');
            setTimeout(() => this.classList.remove('scale-95'), 100);
        });

        // Background subtle parallax or movement could go here
    </script>
</body></html>
