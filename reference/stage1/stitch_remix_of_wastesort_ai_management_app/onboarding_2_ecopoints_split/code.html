<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(224, 224, 224, 0.5);
    }
    .floating-anim {
      animation: floating 3s ease-in-out infinite;
    }
    @keyframes floating {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }
    .pulse-glow {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .7; }
    }
  </style>

<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-background flex justify-between items-center px-margin-mobile py-sm">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="recycling">recycling</span>
<span class="font-headline-md text-headline-md font-bold text-primary">WasteSort AI</span>
</div>
<button class="text-on-surface-variant font-label-md transition-opacity hover:opacity-80 active:scale-95 duration-100">
      Lewati
    </button>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile py-lg max-w-max-width mx-auto">
<!-- Hero Illustration Section -->
<div class="relative w-full flex flex-col items-center mb-xl">
<!-- Background Glow Effect -->
<div class="absolute inset-0 bg-primary-fixed/20 blur-[100px] rounded-full scale-125 z-0"></div>
<div class="relative z-10 floating-anim">
<img alt="EcoPoints Rewards Illustration" class="w-64 h-64 md:w-80 md:h-80 object-contain drop-shadow-2xl" src="https://lh3.googleusercontent.com/aida/AP1WRLs3_5n2jVhFj0Om9q6qfJV2SH0FEZ6ctoH-Pes5EZ7g56g_lbWL7ABoUf6gP1uP6YnlrT76zlQJRXZXhafLcOoYolJ5OaoTSqWdryKyqM4WrfawpNGeUeDCpOerxxkdte8XiIpqwpkrFeOn8SrBrWV3aPciuDEwoGJ27pTC3GNqLDU63Dk6Vu5TMtdFqEd_t0Y_81Nonj-Zg9zuwWw-oQB32wvAauiabDzPIOWJ9_CmcfEK0x91v2qqI7sr"/>
</div>
<!-- Badge Overlay -->
<div class="mt-8">
<div class="glass-card px-md py-xs rounded-full flex items-center gap-xs shadow-sm border border-outline-variant/30">
<span class="text-lg">🏆</span>
<span class="font-label-md text-label-md text-on-surface uppercase tracking-wider">EcoPoints</span>
</div>
</div>
</div>
<!-- Content Text Section -->
<div class="text-center space-y-md max-w-lg mx-auto">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">
        Setiap Sampah Bernilai
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
        Kumpulkan poin dari setiap sampah yang kamu pilah dan tukarkan dengan berbagai reward menarik.
      </p>
</div>
</main>
<!-- Navigation Shell (Bottom Area) -->
<footer class="w-full pb-xl flex flex-col items-center gap-lg">
<!-- BottomNavBar (Indicators) -->
<div class="flex justify-center items-center gap-xs">
<!-- 1st Dot -->
<div class="w-2 h-2 bg-outline-variant rounded-full transition-all duration-300"></div>
<!-- 2nd Dot (Active) -->
<div class="w-3 h-3 bg-primary rounded-full transition-all duration-300 pulse-glow"></div>
<!-- 3rd Dot -->
<div class="w-2 h-2 bg-outline-variant rounded-full transition-all duration-300"></div>
</div>
<!-- CTA Button -->
<div class="w-full px-margin-mobile md:w-auto md:min-w-[320px]">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-md rounded-full shadow-lg flex items-center justify-center gap-sm transition-all hover:scale-[1.02] active:scale-95 duration-100">
        Lihat Reward
        <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</footer>
<script>
    // Subtle interactivity
    document.addEventListener('DOMContentLoaded', () => {
      const button = document.querySelector('button');
      button.addEventListener('mousedown', () => {
        button.classList.add('scale-95');
      });
      button.addEventListener('mouseup', () => {
        button.classList.remove('scale-95');
      });
      button.addEventListener('mouseleave', () => {
        button.classList.remove('scale-95');
      });
    });
  </script>
