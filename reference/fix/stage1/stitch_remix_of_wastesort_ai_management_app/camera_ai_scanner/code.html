<style>
        .camera-vignette {
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.4) 100%);
        }
        .scanning-line {
            height: 2px;
            background: #a3f69c;
            box-shadow: 0 0 15px #2e7d32;
            animation: scan 3s linear infinite;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .pulse-shutter {
            animation: pulse-shutter 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-shutter {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        .glass-blur {
            backdrop-filter: blur(12px);
            background: rgba(25, 28, 29, 0.6);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-on-background text-on-primary overflow-hidden h-screen w-screen flex flex-col font-body-md">

<div class="absolute inset-0 camera-vignette"></div>
</div>
<!-- UI Overlay Layer -->
<div class="relative z-10 flex flex-col h-full justify-between">
<!-- Top Control Bar -->
<header class="flex items-center justify-between px-margin-mobile py-lg w-full max-w-max-width mx-auto">
<button aria-label="Close" class="w-12 h-12 flex items-center justify-center rounded-full glass-blur text-white active:scale-95 transition-transform">

<div class="glass-blur px-md py-sm rounded-full flex items-center gap-xs">
<div class="w-2 h-2 rounded-full bg-primary-fixed animate-pulse"></div>
<span class="font-label-md text-label-md tracking-wider">AI READY</span>
</div>
</div>
<button aria-label="Settings" class="w-12 h-12 flex items-center justify-center rounded-full glass-blur text-white active:scale-95 transition-transform">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<!-- Scanning Frame -->
<main class="flex-grow flex flex-col items-center justify-center relative">
<div class="relative w-[280px] h-[280px] md:w-[400px] md:h-[400px] pointer-events-none">
<!-- Corner Borders -->

<div class="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-primary-fixed rounded-bl-xl"></div>
<div class="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-primary-fixed rounded-br-xl"></div>

<!-- Interactive Layer: JavaScript for micro-interactions -->
<script>
        // Flash Toggle
        const flashBtn = document.getElementById('flash-toggle');
        let flashOn = false;
        flashBtn.addEventListener('click', () => {
            flashOn = !flashOn;
            const icon = flashBtn.querySelector('.material-symbols-outlined');
            icon.textContent = flashOn ? 'flash_on' : 'flash_off';
            flashBtn.classList.toggle('bg-primary-fixed', flashOn);
            flashBtn.classList.toggle('text-on-primary-fixed', flashOn);
        });

        // Shutter Effect
        const shutterBtn = document.getElementById('shutter');
        shutterBtn.addEventListener('click', () => {
            // Flash visual feedback
            const flashOverlay = document.createElement('div');
            flashOverlay.className = 'fixed inset-0 bg-white z-[100] transition-opacity duration-300';
            document.body.appendChild(flashOverlay);
            
            setTimeout(() => {
                flashOverlay.style.opacity = '0';
                setTimeout(() => flashOverlay.remove(), 300);
            }, 50);

            // Shutter sound or haptic feedback simulation
            if ('vibrate' in navigator) {
                navigator.vibrate(50);
            }
        });

        // Simple Scan Guide Interaction
        const guideToggle = document.getElementById('guide-toggle');
        guideToggle.addEventListener('click', () => {
            const icon = guideToggle.querySelector('.material-symbols-outlined');
            const isFilled = icon.style.fontVariationSettings.includes("'FILL' 1");
            icon.style.fontVariationSettings = isFilled ? "'FILL' 0" : "'FILL' 1";
            guideToggle.classList.toggle('text-primary-fixed');
        });
    </script>
